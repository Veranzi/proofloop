```yaml
# Deploy Flutter Web to Firebase Hosting on merge

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Verify Flutter is available
      - name: Check Flutter version
        run: flutter --version

      # 4. Install dependencies
      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      # 5. Build the web frontend
      - name: Build Flutter web
        working-directory: frontend
        run: flutter build web --release

      # 6. Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UNDERCURRENT_CB9F8 }}
          channelId: live
          projectId: undercurrent-cb9f8
```
