name: Backend CI

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pruflo
          POSTGRES_DB: pruflo
          # Throwaway database reachable only from this job, so no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pruflo" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Cloud Storage and Pub/Sub stand-ins for tests/test_gcp_emulators.py
      # (the same images as docker-compose.yml).
      - name: Start the storage and Pub/Sub emulators
        run: |
          docker run -d -p 4443:4443 fsouza/fake-gcs-server:1.52.2 \
            -scheme http -port 4443 -public-host localhost:4443
          docker run -d -p 8085:8085 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=pruflo-local
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - name: Wait for the emulators
        run: |
          for i in $(seq 60); do
            curl -sf http://localhost:4443/storage/v1/b >/dev/null && curl -s http://localhost:8085 >/dev/null && exit 0
            sleep 2
          done
          exit 1
      - run: pytest
        env:
          PRUFLO_REQUIRE_EMULATORS: "1"  # fail, don't skip, if they're missing
