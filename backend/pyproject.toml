[project]
name = "pruflo-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"app/db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["firebase_admin.*", "google.cloud.*", "google.auth.*", "google.oauth2.*", "openpyxl.*", "docx.*", "pdfplumber.*", "pdfminer.*", "fpdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
module = ["app.reports.pdf"]
disallow_subclassing_any = false  # fpdf2 ships no type hints
